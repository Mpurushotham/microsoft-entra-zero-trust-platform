name: "70 · Security operations (Sentinel, Defender XDR)"

on:
  pull_request:
    paths:
      - terraform/stacks/70-security-operations/**
      - terraform/modules/secops-*/**
      - .github/workflows/70-security-operations.yml
      - .github/workflows/_terraform-reusable.yml
  push:
    branches: [main]
    paths:
      - terraform/stacks/70-security-operations/**
      - terraform/modules/secops-*/**
      - .github/workflows/70-security-operations.yml
      - .github/workflows/_terraform-reusable.yml
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
      action:
        type: choice
        options: [plan, apply, destroy-plan]
        default: plan

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-plan:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: 70-security-operations
      environment: ${{ matrix.environment }}
      action: plan
    secrets: inherit

  dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: 70-security-operations
      environment: dev
      action: apply
    secrets: inherit

  prod:
    if: github.event_name == 'push'
    needs: dev
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: 70-security-operations
      environment: prod
      action: apply
    secrets: inherit

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: 70-security-operations
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
    secrets: inherit
