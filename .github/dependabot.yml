version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /terraform/stacks/*
      - /terraform/modules/*
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: terraform
